# Project-wide Gradle settings.

# Heap sizing matters more than raw size here. This machine has 7 GB total and
# R8 minifyReleaseWithR8 alone asks for most of it. A 4096m heap on top of an
# already-busy desktop pushed the daemon into swap and the same build that
# takes ~7 minutes cold ran for 36+ minutes without finishing (measured: the
# java process sat at 39% CPU with 1 GB free). 3g leaves room for the OS and
# the Kotlin daemon, so R8 runs at full speed instead of GC-thrashing.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Bound the Kotlin compile daemon separately so it cannot compete with R8 for
# the same 7 GB.
kotlin.daemon.jvmargs=-Xmx1536m

# Performance & Caching optimizations
org.gradle.parallel=true
# Configuration cache DISABLED, deliberately — see the note below.
#
# This tree was created by copying the pre-rename ROM-Shifter project, and it
# inherited that project's `.gradle/configuration-cache`. The cache kept
# resolving source roots to the old path, so builds reported warnings that named
# a different directory and suppressed three of ours. `--rerun-tasks` did not
# help and neither did `--no-build-cache`; only deleting the cache did.
#
# That is a bad failure mode for a directory that has been renamed: the cache
# keeps working, silently, pointing somewhere else. The build here is fast
# enough without it (the expensive R8 step is covered by the local build cache
# below), so this trades a little time for diagnostics that can be trusted.
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache=false
org.gradle.workers.max=2

# LOCAL BUILD CACHE - this was the big missing one. Without it every source
# change re-ran minifyReleaseWithR8 (and resource shrinking) from scratch, which
# is where nearly all of the wall-clock time went. With it, any task whose
# inputs are unchanged is restored from ~/.gradle/caches/build-cache-1 instead
# of being recomputed, so a rebuild after a non-code change (docs, a resource,
# a failed later task) no longer pays for R8 again.
org.gradle.caching=true

# Filesystem watching keeps Gradle's up-to-date checks incremental instead of
# re-statting the whole tree on every invocation.
org.gradle.vfs.watch=true

# Kotlin code style
kotlin.code.style=official
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
